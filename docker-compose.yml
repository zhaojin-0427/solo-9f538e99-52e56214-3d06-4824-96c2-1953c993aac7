services:
  api:
    build: .
    image: resighting-api:latest
    container_name: resighting-api
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/resighting.db
    volumes:
      - resighting-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  resighting-data:
